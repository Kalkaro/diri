name: Nix hashes

# flake.nix fetches a Git dependency in diri/Cargo.lock as just its pinned
# commit when nix/cargo-git-hashes.json has that commit's hash; otherwise it
# clones the dependency's whole repository with every branch, tag and pull
# request (about 1.3 GB for Zed, against 89 MB for the commit). This
# regenerates the file whenever Cargo.lock or the flake changes on main and
# proposes any difference as a pull request. Not a required check: a stale file
# makes the flake slower, never broken.
#
# GitHub starts no workflows for a pull request opened with GITHUB_TOKEN, so CI
# runs on it only after it is closed and reopened, unless a NIX_HASHES_TOKEN
# secret holds a fine-grained token with Contents and Pull requests write
# access. With GITHUB_TOKEN the repository must also allow GitHub Actions to
# create pull requests (Settings > Actions > General).

on:
  push:
    branches: [main]
    paths:
      - diri/Cargo.lock
      - flake.lock
      - flake.nix
      - nix/**
      - scripts/update-nix-hashes.sh
      - .github/workflows/nix-hashes.yml
  workflow_dispatch:

permissions:
  contents: read

# Only the newest main matters; an older run would propose stale hashes.
concurrency:
  group: nix-hashes
  cancel-in-progress: true

jobs:
  update:
    name: Update Nix hashes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: bot/nix-hashes
      GH_TOKEN: ${{ secrets.NIX_HASHES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.NIX_HASHES_TOKEN || github.token }}
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Regenerate nix/cargo-git-hashes.json
        run: scripts/update-nix-hashes.sh
      # The hashes come from fetchgit itself, so this only guards against
      # proposing a flake that no longer evaluates. It fetches no Git
      # dependency.
      - name: Evaluate the flake
        run: nix eval --raw .#packages.x86_64-linux.diri.drvPath
      - name: Open or update the pull request
        run: |
          state="$(gh pr view "${BRANCH}" --json state --jq .state 2>/dev/null || true)"
          if git diff --quiet -- nix/cargo-git-hashes.json; then
            echo "nix/cargo-git-hashes.json is up to date."
            if [[ "${state}" == OPEN ]]; then
              gh pr close "${BRANCH}" --delete-branch --comment "main already has these hashes."
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "${BRANCH}"
          git commit --message "Update Nix hashes for Cargo Git dependencies" -- nix/cargo-git-hashes.json
          git push --force origin "${BRANCH}"
          if [[ "${state}" != OPEN ]]; then
            gh pr create --base main --head "${BRANCH}" \
              --title "Update Nix hashes for Cargo Git dependencies" \
              --body "Regenerated by scripts/update-nix-hashes.sh for ${GITHUB_SHA}."
          fi
